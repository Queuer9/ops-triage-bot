name: Ops request triage

# Manual fallback only — the live bot runs as a Cloudflare Worker on a 1-minute cron.
# (GitHub throttled the old cron schedule to ~3-hour gaps; don't re-add it while the Worker is live.)
on:
  workflow_dispatch: {} # manual "Run workflow" only

concurrency:
  group: ops-triage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync Slack <-> Asana
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          # Comma-separated channel IDs to watch; the bot must be a member of each.
          SLACK_CHANNEL_IDS: "C09RRCML3QQ"
        run: node src/sync.js

# touch: force workflow registration
