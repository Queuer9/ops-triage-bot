name = "ops-triage-bot"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false # cron-only worker, no public URL

[triggers]
crons = ["* * * * *"] # every minute

[vars]
# Comma-separated Slack channel IDs to watch; the bot must be a member of each.
SLACK_CHANNEL_IDS = "C09RRCML3QQ"

[observability]
enabled = true
